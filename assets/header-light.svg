<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">DLYZZT — Building useful things with AI.</title>
<desc id="desc">Blue and violet banner, with an abstract terminal showing idea, build, and ship.</desc>
<defs>
  <linearGradient id="line"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#6366f1" stop-opacity=".19"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dce3f2" stroke-width=".5"/></pattern>
  <clipPath id="clip"><rect width="1200" height="340" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)">
<rect width="1200" height="340" fill="#f5f7ff"/>
<rect x="685" width="515" height="340" fill="url(#grid)"/>
<ellipse cx="1000" cy="170" rx="390" ry="320" fill="url(#glow)"/>
<rect x="48" y="44" width="28" height="4" rx="2" fill="url(#line)"/>
<text x="89" y="51" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3" fill="#5c6a85">INDEPENDENT BUILDER</text>
<text x="48" y="146" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="72" font-weight="750" letter-spacing="-3" fill="#17213b">DLYZZT<tspan fill="#6366f1">.</tspan></text>
<text x="51" y="197" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="29" font-weight="500" letter-spacing="-.5" fill="#17213b">Building useful things with AI.</text>
<text x="51" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#5c6a85">AGENTS  /  DESKTOP APPS  /  DEVELOPER TOOLS</text>
<path d="M51 289H655" stroke="#dce3f2"/>
<circle cx="55" cy="310" r="3" fill="#34d399"/>
<text x="68" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1" fill="#5c6a85">SMALL IDEAS. REAL TOOLS.</text>
<rect x="781" y="65" width="356" height="218" rx="14" fill="#ffffff" stroke="#dce3f2"/>
<path d="M781 103H1137" stroke="#dce3f2"/>
<circle cx="802" cy="85" r="4" fill="#f87171"/><circle cx="817" cy="85" r="4" fill="#fbbf24"/><circle cx="832" cy="85" r="4" fill="#34d399"/>
<text x="860" y="89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#5c6a85">~/workbench</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
<text x="807" y="141" fill="#5c6a85"><tspan fill="#38bdf8">❯</tspan> idea</text>
<text x="807" y="179" fill="#5c6a85"><tspan fill="#818cf8">❯</tspan> build</text>
<text x="807" y="217" fill="#17213b"><tspan fill="#a78bfa">❯</tspan> ship something useful</text>
</g>
<rect x="807" y="243" width="10" height="16" rx="2" fill="#6366f1"><animate attributeName="opacity" values="1;1;0;0;1" dur="2s" repeatCount="indefinite"/></rect>
<path d="M0 337H1200" stroke="url(#line)" stroke-width="6"/>
</g></svg>