name: Update GitHub profile assets

on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update-stars.py
      - .github/workflows/update-stars.yml

permissions:
  contents: write

concurrency:
  group: update-github-profile-assets
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Generate light and dark star cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/update-stars.py --username "$PROFILE_OWNER"
      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ github.token }}
          outputs: |
            assets/github-snake.svg?color_snake=%236366f1&color_dots=%23eef2ff,%23c7d2fe,%23a5b4fc,%23818cf8,%234f46e5
            assets/github-snake-dark.svg?palette=github-dark&color_snake=%23a78bfa&color_dots=%23161b22,%23312e81,%234f46e5,%23818cf8,%23c4b5fd
      - name: Save updated profile assets
        run: |
          git add assets/github-stars-light.svg assets/github-stars-dark.svg assets/github-snake.svg assets/github-snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update GitHub profile assets'
          git push
